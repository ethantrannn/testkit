# testkit-automate: Playwright regression suite in qa/automation.
# Copy to .github/workflows/e2e.yml.
#   Pull requests: smoke suite (@smoke). Nightly + manual: full suite.
# Repository settings → Secrets and variables → Actions:
#   variable TESTKIT_BASE_URL         base_url of a non-production environment from qa/config.yml
#   secrets  TESTKIT_E2E_<ROLE>_EMAIL / TESTKIT_E2E_<ROLE>_PASSWORD   one pair per role in tests/auth.setup.ts
# Actions are pinned to commit SHAs (tag in the comment); let Dependabot/Renovate bump them.
name: e2e

on:
  pull_request:
  schedule:
    - cron: "0 19 * * *" # 02:00 Asia/Saigon (cron is UTC)
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qa/automation
    env:
      TESTKIT_BASE_URL: ${{ vars.TESTKIT_BASE_URL }}
      TESTKIT_E2E_MEMBER_EMAIL: ${{ secrets.TESTKIT_E2E_MEMBER_EMAIL }}
      TESTKIT_E2E_MEMBER_PASSWORD: ${{ secrets.TESTKIT_E2E_MEMBER_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/automation/package-lock.json

      - run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('qa/automation/package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Smoke suite (pull request)
        if: github.event_name == 'pull_request'
        run: npx playwright test --grep @smoke

      - name: Full suite (nightly / manual)
        if: github.event_name != 'pull_request'
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            qa/automation/reports/
            qa/automation/test-results/
          retention-days: 14
          if-no-files-found: ignore
