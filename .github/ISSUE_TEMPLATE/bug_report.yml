name: Bug report
description: Something in testkit does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Coding agent
      multiple: true
      options: [Claude Code, Codex, Cursor, Gemini CLI, GitHub Copilot, other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: testkit version (`testkit version`), coding agent version, OS
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: testkit doctor output
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs or files
      description: Relevant output, qa/ files or screenshots. Remove URLs, accounts and anything secret first.
